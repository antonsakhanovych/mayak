[package]
name = "mayak-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
rcon = { version = "0.6.0", features = ["rt-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
