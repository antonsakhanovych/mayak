name: mayak

services:
  server:
    image: itzg/minecraft-server:latest  # bundles multiple JDKs, auto-picks the right one for VERSION
    container_name: mayak
    tty: true
    stdin_open: true
    ports:
      - "${SERVER_PORT:-25565}:25565"
    env_file:
      - mayak-mc/mc.env
      - mayak-mc/.env
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      OVERRIDE_SERVER_PROPERTIES: "true"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      USER_API_PROVIDER: "mojang"
    volumes:
      - "${DATA_DIR:-./mayak-mc/data}:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 10

  bot:
      build: ./mayak-bot
      image: mayak-bot:local
      container_name: mayak-bot
      depends_on:
        server:
          condition: service_healthy
      env_file:
        - mayak-bot/.env
      environment:
        RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      volumes:
        - "${DATA_DIR:-./mayak-mc/data}:/data:ro"
      restart: unless-stopped

  backup:
    build: ./mayak-backup
    image: mayak-backup:local
    container_name: mayak-backup
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - mayak-backup/backup.env
      - mayak-backup/.env
    environment:
      RCON_HOST: "server"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
    volumes:
      - "${DATA_DIR:-./mayak-mc/data}:/data:ro"
    restart: unless-stopped
