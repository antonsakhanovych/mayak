name: mayak

services:
  server:
    image: itzg/minecraft-server:latest  # bundles multiple JDKs, auto-picks the right one for VERSION
    container_name: mayak
    tty: true
    stdin_open: true
    ports:
      - "${SERVER_PORT:-25565}:25565"
    env_file:
      - mayak-mc/mc.env
      - mayak-mc/.env
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      OVERRIDE_SERVER_PROPERTIES: "true"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      USER_API_PROVIDER: "mojang"
    volumes:
      - "${DATA_DIR:-./mayak-mc/data}:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 10

  bot:
      build: ./mayak-bot
      image: mayak-bot:local
      container_name: mayak-bot
      depends_on:
        server:
          condition: service_healthy
      env_file:
        - mayak-bot/.env
      environment:
        RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      volumes:
        - "${DATA_DIR:-./mayak-mc/data}:/data:ro"
      restart: unless-stopped

  # Required, same tier as the other services - needs
  # mayak-cloudflared/{config.yml,credentials.json} set up first (gitignored,
  # deployment-specific - see mayak-cloudflared/config.yml.example);
  # `make up`/`make deploy` guard on both existing, same pattern as the
  # other env files. Reaches BlueMap at http://server:8100 directly on this
  # compose network, so the server no longer publishes that port to the
  # host - only reachable through the tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mayak-cloudflared
    command: tunnel run
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./mayak-cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./mayak-cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    restart: unless-stopped

  backup:
    build: ./mayak-backup
    image: mayak-backup:local
    container_name: mayak-backup
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - mayak-backup/backup.env
      - mayak-backup/.env
    environment:
      RCON_HOST: "server"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
    volumes:
      - "${DATA_DIR:-./mayak-mc/data}:/data:ro"
    restart: unless-stopped
